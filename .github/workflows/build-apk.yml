name: Build SAMP Mobile APK

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android Licenses & Install NDK / CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        id: build_step
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v0.8.2.8
          name: "SAMP Mobile v0.8.2.8 (4KING SOBAD - Damage Sync Fix, AFK Hourglass Fix & Custom Nickname)"
          body: |
            ### 4KING SOBAD v0.8.2.8 Update
            - **แก้ไขระบบดาเมจ (Damage Sync Fix)**:
              - แก้ไขบั๊กใน `ComputeDamageResponse` ที่ผู้เล่น PC ตี/ยิง ผู้เล่นมือถือแล้วดาเมจไม่เข้า (ก่อนหน้านี้มีเงื่อนไข abort ผิดพลาด ทำให้ดาเมจไม่ถูกส่งต่อไปยังตัวเกมและเซิร์ฟเวอร์)
              - แก้ไข pointer Entity ของผู้ยิงใน Bullet Sync Packet (`StoreBulletFullSyncData`)
            - **แก้ไขปัญหายืนนิ่งแล้วขึ้นนาฬิกาทราย (AFK / Hourglass Fix)**:
              - แก้ไขใน `SendOnFootFullSyncData` ให้ส่ง sync packet ทุกๆ 500ms แม้ตัวละครจะยืนอยู่นิ่งๆ ป้องกันเซิร์ฟเวอร์ตัดเข้าโหมด AFK/Pause
            - **ตั้งชื่อตัวละครเองได้ในรันเชอร์ (Custom Nickname & Settings Sync)**:
              - เพิ่มช่องกรอกชื่อตัวละคร (Nickname) ในหน้าต่างเชื่อมต่อเซิร์ฟเวอร์ สามารถตั้งหรือเปลี่ยนชื่อก่อนกด "เข้าเล่นเกม" ได้ทันที
              - ซิงค์การตั้งค่า (`settings.ini`) ไปยังทุก Path บนเครื่องของผู้เล่น ทั้ง `/storage/emulated/0/GTA/SAMP/`, `/sdcard/GTA/SAMP/` และ internal files
            - **ปรับแต่งหน้าตารันเชอร์ภาษาไทย (Beautiful Thai Launcher UI)**:
              - แปลเมนูและการตั้งค่าเป็นภาษาไทยทั้งหมด (คีย์บอร์ดไทย, สลับเสียงไมค์, แสดง FPS, จำกัด FPS, จำนวนแชท)
              - อัปเดตเครดิตเป็น `4KING SOBAD TEAM © 2026`
              - เชื่อมต่อการตั้งค่า FPS Limit (30, 60, 90, 120 FPS) ให้มีผลต่อ Game Engine โดยตรง
          files: app/build/outputs/apk/**/*.apk

      - name: Push Build Failure Log to Branch
        if: failure()
        run: |
          echo "Build failed. Gathering logs..."
          mkdir -p build_logs
          cp build.log build_logs/ || true
          find app/.cxx -type f \( -name "*.txt" -o -name "*.log" \) -exec cp {} build_logs/ \; || true
          git checkout -B build-error-log
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f build_logs/
          git commit -m "Auto-collected build failure logs" || true
          git push -f origin build-error-log || true

      - name: Upload Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build.log
            app/.cxx/
            app/build/reports/
          include-hidden-files: true
