name: Build SAMP Mobile APK

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android Licenses & Install NDK / CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v0.8.2.1
          name: "SAMP Mobile v0.8.2.1 ([TH] 4KING ROLEPLAY)"
          body: |
            ### SAMP Mobile v0.8.2.1
            - Configured Server: `192.168.1.112:7777` ([TH] 4KING ROLEPLAY)
            - Default Nickname: `Tham_Player`
            - Supports both ARM64-v8a and ARMeabi-v7a
          files: app/build/outputs/apk/**/*.apk

      - name: Dump CMake Logs on Failure
        if: failure()
        run: |
          echo "================ CMake Error Logs ================"
          find app/.cxx -type f \( -name "*.txt" -o -name "*.log" \) | while read -r file; do
            echo "::group::$file"
            cat "$file"
            echo "::endgroup::"
          done || true

      - name: Upload Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            app/.cxx/
            app/build/reports/
          include-hidden-files: true
