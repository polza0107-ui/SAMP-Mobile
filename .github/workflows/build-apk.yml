name: Build SAMP Mobile APK

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android Licenses & Install NDK / CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        id: build_step
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v0.8.3.5
          name: "SAMP Mobile v0.8.3.5 (4KING SOBAD - Fix Dialog Kick on Login)"
          body: |
            ### 4KING SOBAD v0.8.3.5 Update
            - Fix SendDialogResponse parameter order matching RakNet native C++ (response=1, dialogId=1100, listitem=0).
            - Fix Server closed connection / Kick on CEF login submission.
            - **ระบบ CEF WebUI Overlay บนมือถือ (CEF Bridge for Android)**:
              - เพิ่มโมดูล CefManager (WebView Bridge) ดักจับอีเวนต์ JavaScript `window.cef.emit` และ `window.cef.on`
              - รองรับการเปิดหน้าต่าง CEF จากโฟลเดอร์ Web GUI (index.html, 4.html, inventory.html ฯลฯ) บนมือถือได้เหมือน PC
              - สามารถรับคำสั่ง `$cef:open <url>` และ `$cef:close` จากเซิร์ฟเวอร์เพื่อเปิด/ปิดหน้าเว็บได้ทันที
              - สะพานคำสั่งส่งต่อ `/login <pass>`, `/register <pass>`, `/selectschool <key>` กลับไปประมวลผลบนเซิร์ฟเวอร์
            - **ระบบแสดงผลเต็มจอสมบูรณ์แบบ & ไอคอนและปุ่ม HUD คมชัด**:
              - ซ่อนแถบ Status Bar / Navigation Bar อัตโนมัติ
              - ปรับแต่งหน้าโหลดและปุ่มสัมผัสในเกมครบถ้วน
          files: app/build/outputs/apk/**/*.apk

      - name: Push Build Failure Log to Branch
        if: failure()
        run: |
          echo "Build failed. Gathering logs..."
          mkdir -p build_logs
          cp build.log build_logs/ || true
          find app/.cxx -type f \( -name "*.txt" -o -name "*.log" \) -exec cp {} build_logs/ \; || true
          git checkout -B build-error-log
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f build_logs/
          git commit -m "Auto-collected build failure logs" || true
          git push -f origin build-error-log || true

      - name: Upload Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build.log
            app/.cxx/
            app/build/reports/
          include-hidden-files: true
