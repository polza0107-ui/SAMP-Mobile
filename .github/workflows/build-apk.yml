name: Build SAMP Mobile APK

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android Licenses & Install NDK / CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --info

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Dump CMake Logs on Failure
        if: failure()
        run: |
          echo "================ CMake Error Logs ================"
          find app/.cxx -type f \( -name "*.txt" -o -name "*.log" \) | while read -r file; do
            echo "::group::$file"
            cat "$file"
            echo "::endgroup::"
          done || true

      - name: Upload Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            app/.cxx/
            app/build/reports/
          include-hidden-files: true
