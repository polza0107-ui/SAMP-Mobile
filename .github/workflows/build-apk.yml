name: Build SAMP Mobile APK

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android Licenses & Install NDK / CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        id: build_step
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v0.8.2.6
          name: "SAMP Mobile v0.8.2.6 (4KING SOBAD - Thai Language & Logo)"
          body: |
            ### 4KING SOBAD v0.8.2.6
            - **Thai Language & Encoding Support**: Added CP874 (TIS-620) & UTF-8 passthrough decoder for chat, dialogs, labels, and input
            - **Thai Fonts**: Integrated Thai TTF font (Tahoma/Arial) auto-extracted to `/storage/emulated/0/GTA/SAMP/fonts/`
            - **Android Keyboard**: Enabled `androidkeyboard = 1` for native Thai keyboard input
            - **App Branding**: Updated App Name to `4KING SOBAD`
            - **New Logo**: Applied custom 4KING SOBAD logo across launcher icons, splash screen, and loading screen
            - Direct connection to `192.168.1.112:7777`
            - Support cache in `/storage/emulated/0/GTA/` and `/sdcard/GTA/`
            - Added All Files Access permission handling for Android 11-16
            - Fixed `OS_FileRead` null pointer crash when game files are missing
            - Removed `android:gwpAsanMode="always"` causing HyperOS memory aborts
            - Configured Server: `192.168.1.112:7777` ([TH] 4KING ROLEPLAY)
            - Default Nickname: `Tham_Player`
            - Supports both ARM64-v8a and ARMeabi-v7a
          files: app/build/outputs/apk/**/*.apk

      - name: Push Build Failure Log to Branch
        if: failure()
        run: |
          echo "Build failed. Gathering logs..."
          mkdir -p build_logs
          cp build.log build_logs/ || true
          find app/.cxx -type f \( -name "*.txt" -o -name "*.log" \) -exec cp {} build_logs/ \; || true
          git checkout -B build-error-log
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f build_logs/
          git commit -m "Auto-collected build failure logs" || true
          git push -f origin build-error-log || true

      - name: Upload Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build.log
            app/.cxx/
            app/build/reports/
          include-hidden-files: true
