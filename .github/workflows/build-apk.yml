name: Build SAMP Mobile APK

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android Licenses & Install NDK / CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        id: build_step
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v0.8.3.1
          name: "SAMP Mobile v0.8.3.1 (4KING SOBAD - Fullscreen Immersive, Custom Loading & Fixed HUD Buttons)"
          body: |
            ### 4KING SOBAD v0.8.3.1 Update
            - **แก้ไขแถบแจ้งเตือนด้านบน (Fullscreen Immersive Sticky Mode)**:
              - ซ่อน Status Bar และ Navigation Bar ไม่ให้แถบแจ้งเตือนของโทรศัพท์เลื่อนลงมาบดบังหน้าจอตอนเปิดแอป
            - **หน้าต่างโหลด (Loading Screen & Splash)**:
              - เปลี่ยนโลโก้เป็น 4KING SOBAD ขนาดใหญ่ คมชัด สวยงาม
              - เปลี่ยนหลอดวิ่งเป็น Progress Bar สีฟ้า-ม่วงนีออน พร้อมข้อความสถานะการโหลดก่อนเข้าเกม
              - อัปเดตไอคอนของแอป (App Launcher Icons) เป็นโลโก้ 4KING SOBAD
            - **แก้ไขปุ่มควบคุมผู้เล่น (HUD Widgets / Touch Buttons)**:
              - แก้ไขระบบ RLE Decompression ใน libsamp.so ไม่ให้เกิด rled error 3 ข้อมูลเท็กซ์เจอร์ปุ่มถูกตัดทอน
              - แก้ไขปัญหาปุ่มวิ่ง ต่อย กระโดด ขับรถ ที่ไอคอนขาดหายหรือเป็นวงกลมว่างเปล่า ให้แสดงภาพครบถ้วน 100%
          files: app/build/outputs/apk/**/*.apk

      - name: Push Build Failure Log to Branch
        if: failure()
        run: |
          echo "Build failed. Gathering logs..."
          mkdir -p build_logs
          cp build.log build_logs/ || true
          find app/.cxx -type f \( -name "*.txt" -o -name "*.log" \) -exec cp {} build_logs/ \; || true
          git checkout -B build-error-log
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f build_logs/
          git commit -m "Auto-collected build failure logs" || true
          git push -f origin build-error-log || true

      - name: Upload Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build.log
            app/.cxx/
            app/build/reports/
          include-hidden-files: true
