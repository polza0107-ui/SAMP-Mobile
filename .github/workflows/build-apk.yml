name: Build SAMP Mobile APK

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android Licenses & Install NDK / CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        id: build_step
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v0.8.5.5
          name: "SAMP Mobile v0.8.5.5 (4KING SOBAD - Clean Engine Build)"
          body: |
            ### 4KING SOBAD v0.8.4.8 Update
            - **FPS Limit Unlock (ปลดล็อก FPS ทะลุ 60FPS สูงสุด 120FPS)**:
              - แก้ไขโค้ด C++ (ARM64 & 32-bit) ที่เดิมมีการ Hardcode คำสั่ง Assembly ล็อกไว้ที่ 60 FPS
              - แปลงคำสั่ง Assembly เป็นแบบไดนามิก รองรับการปรับ 90 FPS และ 120 FPS ตามที่ผู้เล่นเลือกจริง
              - ปลดล็อก Android Display Refresh Rate Mode ในระบบ ให้หน้าต่างเกมรันตาม Refresh Rate สูงสุดของหน้าจอมือถือ (90Hz / 120Hz / 144Hz)
            - **Real-time Server Offline Detection (ระบบตรวจจับเซิร์ฟเวอร์ปิดอัตโนมัติ)**:
              - เมื่อเซิร์ฟเวอร์ปิดให้บริการ หรือไม่สามารถเชื่อมต่อได้ ไฟสถานะจะเปลี่ยนเป็นสีแดงสด 🔴 ทันที
              - ข้อความสถานะเปลี่ยนเป็น `OFFLINE 🔴 เซิร์ฟเวอร์ปิดให้บริการ`
              - หากผู้เล่นกดปุ่ม "▶ เริ่มเกม" ขณะเซิร์ฟเวอร์ออฟไลน์ ระบบจะมีหน้าต่างเตือนแจ้งว่าเซิร์ฟเวอร์ยังไม่เปิดให้บริการ
              - สามารถแตะที่การ์ดสถานะเพื่อสั่ง Refresh ตรวจสอบสถานะใหม่ได้ตลอดเวลา
              - รองรับการสั่งปิดเซิร์ฟเวอร์จากระยะไกลผ่าน `security.json` บน GitHub ทันที
            - **New Launcher Cover Art (ภาพปกแก๊ง 4 หนุ่ม 4KINGS ฝนตกสายฟ้าฟาด)**:
              - อัปเดตภาพพื้นหลังหน้าหลักเป็นลายเส้นจิบิ 4KINGS SOBAD ความละเอียดสูง 16:9 สีสันสดใสตรงอัตลักษณ์เซิร์ฟเวอร์
            - **Live Announcement Marquee Banner (ระบบแถบวิ่งประกาศข่าวสารเรียลไทม์)**:
              - แสดงแถบวิ่งข่าวสาร/กิจกรรมที่ดึงข้อมูลจาก `security.json` บน GitHub แบบสดๆ
              - แอดมินสามารถแก้ไขข้อความประกาศได้ทันทีผ่าน GitHub โดยไม่ต้องอัปเดตตัวแอป APK
            - **Server Status & Online Counter (กล่องแสดงสถานะเซิร์ฟเวอร์ & จำนวนผู้เล่น)**:
              - แสดงสถานะเซิร์ฟเวอร์ออนไลน์ (Online Dot) ชื่อเซิร์ฟเวอร์ จำนวนผู้เล่น และค่า Ping
              - เชื่อมต่อและดึงข้อมูลเซิร์ฟเวอร์ผ่านระบบคลาวด์จาก `security.json` พร้อมกันในจุดเดียว
            - **One-Click Play (ระบบกดเริ่มเกมชั้นเดียว)**:
              - ตัดหน้าต่างยืนยันซ้ำซ้อนออก กดปุ่ม "▶ เริ่มเกม" แล้วเข้าสู่ขั้นตอนตรวจสอบและเริ่มเล่นได้ทันที
            - **4KING Security Anti-Cheat Scanner (ระบบสแกนไฟล์และกันโปรเต็มรูปแบบ)**:
              - หน้าต่าง UI สแกนไฟล์ความปลอดภัยสไตล์ Dark Glassmorphism พร้อมอนิเมชันสถานะเรียลไทม์
              - ดึงกฎความปลอดภัยและ Hash จาก GitHub (`security.json`) แบบไดนามิก ปรับแต่งได้ตลอดเวลา
              - ตรวจจับ Cleo Mod (`.csa`, `.csi`), สคริปต์ MonetLoader แปลกปลอม (Whitelist: `4king_bridge.lua`), และไฟล์ Data ดัดแปลง (`handling.cfg`, `weapon.dat`)
              - หากตรวจพบการดัดแปลงไฟล์ ระบบจะบังคับลบข้อมูลตัวเกมเดิมออกและให้ดาวน์โหลดข้อมูลใหม่เพื่อความเท่าเทียม
            - **New App Icon (อัปเดตไอคอนแอปใหม่ 123.png)**:
              - อัปเดตไอคอนแอปและไอคอนกลมทุกระดับความละเอียด (Adaptive & Legacy mipmaps)
            - **Full Game Data Downloader (716MB Google Drive Stream)**:
              - เชื่อมต่อไฟล์ตัวเกมเต็ม 716MB (Google Drive ID: `1llB3HedW3IawrFapOVPZ3f4hYRP926Il`)
              - ระบบหลบเลี่ยงหน้าจอเตือนไวรัสสแกนของ Google Drive อัตโนมัติ (`confirm=t` auto token)
              - ตรวจสอบความถูกต้องของไฟล์ ZIP ป้องกันการโหลดไฟล์ไม่ครบ
              - แตกไฟล์ลง `/storage/emulated/0/` โดยตรง ครบทุกโมเดล แมพ และเท็กซ์เจอร์เกม
            - **Mobile Downed Incapacitated Screen (หน้าต่างสลบ/บาดเจ็บสาหัสบนมือถือ)**:
              - แสดงผลหน้าต่างสลบพร้อมขอบจอกระพริบสีแดง (Red Pulse Vignette)
              - นับเวลาถอยหลัง 30 วินาที พร้อมแถบหลอดเวลาเรียลไทม์
              - เมื่อหมดเวลา จะปลดล็อกปุ่มเรืองแสงสีเขียว `🚑 ไปห้องพยาบาล (แตะเพื่อเกิดใหม่)`
              - ส่งคำสั่งกลับเซิร์ฟเวอร์เพื่อวาร์ปไปเกิดที่ห้องพยาบาลสถาบันของผู้เล่นทันที
            - **Discord Card Photo Sync (ระบบบันทึกรูปบัตรประจำตัว)**:
              - รองรับ URL รูปภาพ Discord ไม่จำกัดความยาว
              - แก้ไขปัญหาบัตรเปิดไม่ได้บนมือถือหลังจากใส่รูปลิงก์ Discord เรียบร้อยแล้ว
            - **Native Notification Overlay UI (แจ้งเตือนลอยบนจอมือถือ)**:
              - ระบบแจ้งเตือน Floating Toast/Overlay บน Android แบบ Native (ไม่กินการกดปุ่มบังคับในเกม)
              - ดักจับโปรโตคอล `$notify:<type>|<tag>|<msg>` แปลงฟอนต์ภาษาไทย UTF-8 คมชัด 100%
              - แสดงสีและไอคอนตามสถานะ: Success (เขียว), Error (แดง), Warning (ส้ม), Info (ฟ้า)
            - **Mobile Inventory Action Bridges (ระบบกระเป๋าบนมือถือสมบูรณ์แบบ)**:
              - รองรับปุ่มกด "ใช้" (Use), "ทิ้ง" (Drop), "ให้" (Give) จากหน้าจอ Inventory บนมือถือ
              - ส่งคำสั่งกลับเซิร์ฟเวอร์แบบ Native สอดคล้องกับระบบไอเทม
            - **Crafting Workbench & AFK Zone Bridges**:
              - ปรับแต่งหน้าต่างโต๊ะคราฟให้กดคราฟต่อเนื่องได้ไม่เด้งปิด
              - รองรับปุ่มออกจากโซนอ่านหนังสือ AFK บนมือถือ
          files: app/build/outputs/apk/**/*.apk

      - name: Push Build Failure Log to Branch
        if: failure()
        run: |
          echo "Build failed. Gathering logs..."
          mkdir -p build_logs
          cp build.log build_logs/ || true
          find app/.cxx -type f \( -name "*.txt" -o -name "*.log" \) -exec cp {} build_logs/ \; || true
          git checkout -B build-error-log
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f build_logs/
          git commit -m "Auto-collected build failure logs" || true
          git push -f origin build-error-log || true

      - name: Upload Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build.log
            app/.cxx/
            app/build/reports/
          include-hidden-files: true
