name: Build SAMP Mobile APK

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android Licenses & Install NDK / CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        id: build_step
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v0.8.2.7
          name: "SAMP Mobile v0.8.2.7 (4KING SOBAD - Fix Thai Characters & Fonts)"
          body: |
            ### 4KING SOBAD v0.8.2.7 - Thai Character & Font Rendering Fix
            - **Fixed Thai Character Scrambling in Chat & 3D Labels**:
              - Corrected `Encoding::cp2utf` which previously mistook Thai vowel+consonant pairs (e.g., `ิด`, `ัก`, `ัน`, `ิส`, `ูก`) for 2-byte UTF-8, causing `เปิ?`, `รัก?`, `ด?`, and Russian letters `Ф`/`ç`.
              - Properly prioritize CP874 (TIS-620) single-byte Thai conversion (`0xA1..0xFB`) into valid 3-byte Thai UTF-8 (`0xE0 0xB8/B9 xx`).
            - **Enhanced Thai Font Atlas & Fallback**:
              - Added Thai PUA code point range (`0xF700..0xF71A`) for positioned/shifted tone marks.
              - ImGui now loads bundled full Thai fonts directly from internal app storage and merges system fonts (`NotoSansThai`).
              - `ConfigValidator` now checks exact font file size and reliably overwrites old/incomplete Russian fonts.
            - **Input & Dialog Encoding**:
              - Updated `SAMP.java`, `DialogManager.java`, and `NvEventQueueActivity.java` to use standard Android `TIS-620` with `windows-874` fallback.
              - Changed dialog placeholder and buttons to Thai (`แตะเพื่อพิมพ์`, `ตกลง`, `ยกเลิก`).
            - **Server**: `192.168.1.112:7777` ([TH] 4KING ROLEPLAY)
            - **Direct connection & Android 16 HyperOS support**
          files: app/build/outputs/apk/**/*.apk

      - name: Push Build Failure Log to Branch
        if: failure()
        run: |
          echo "Build failed. Gathering logs..."
          mkdir -p build_logs
          cp build.log build_logs/ || true
          find app/.cxx -type f \( -name "*.txt" -o -name "*.log" \) -exec cp {} build_logs/ \; || true
          git checkout -B build-error-log
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f build_logs/
          git commit -m "Auto-collected build failure logs" || true
          git push -f origin build-error-log || true

      - name: Upload Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build.log
            app/.cxx/
            app/build/reports/
          include-hidden-files: true
